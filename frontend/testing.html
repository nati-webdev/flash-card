<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards: Test</title>
    <link rel="icon" type="image/png" href="images/testing-icon-fov.jpg">

    <!-- this is the code for styling-->
     <link rel="stylesheet" href="styles/general.css">
     <link rel="stylesheet" href="styles/testing.css">
  </head>
  <body class="testing-page">
    <button type="button" class="dark-mode mode js-dark-mode">🌙</button>
    <header class="page-header">
      <h1>Flashcards</h1>
      <h2 class="page-header">Start testing your limit</h3>
    </header>

    <div class="progress-container">

      <div class="progress-info">
        <p class="text">Study progress</p>
        <p class="js-card-count"></p>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>

      <div class="progress-percentage">
        <p class="text">keep going</p>
        <p class="js-percentage"></p>
      </div>

      <div class="progress-info">
        <p class="text">Answers revealed</p>
        <p class="js-revealed-count"></p>
      </div>
    </div>
        
    <div class="data-container js-flash-card"></div>
    
    <div id="flash-card-answer" class="answer-data-container js-flash-card-answer"></div>

    <div class="button-container">
    <button class="return js-return">Return</button>
    <button class="reveal js-reveal" type="button" aria-expanded="false" aria-controls="flash-card-answer">Reveal</button>
    <button class="skip js-skip">Skip</button>
    <button class="add js-add">Add question</button>
    </div>

    <script src="script/testing.js" type="module"></script>
  </body>
</html>
