    <title>Flashcards</title>

      <header class="page-header">
        <h1>Flashcards</h1>
        <h2 class="page-subtitle">Test your limit</h2>
      </header>

      <section class="question-container" aria-label="Add a flashcard topic">
        <label class="visually-hidden" for="question-input">Topic</label>
        <textarea
          id="question-input"
          class="question-input js-question-input"
          placeholder="Enter your topic"
        ></textarea>

        <div class="button-container">
          <button class="question-input-button js-input-button" type="button">Add</button>
          <button class="done-button js-done-button" type="button">Done</button>
          <button class="reset-button js-reset-button" type="button">Reset</button>
        </div>
      </section>

      <section class="answers-container" aria-label="Answer a flashcard">
        <label class="visually-hidden" for="answers-input">Answer</label>
        <textarea
          id="answers-input"
          class="answers-input js-answers-input"
          placeholder="Enter your topic answer"
        ></textarea>

          <button class="answer-input-button js-input-button-answer" type="button">Submit</button>
