<!DOCTYPE html>
<html>
  <head>
    <title>Flash card</title>
    <link rel="icon" type="image/png" href="images/nati-logo-fov.jpg">

    <!-- this is the code for styling-->
     <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <h1>Flash cards</h1>
    <h3>Test your limits</h3>
    <div class="question-container">
      <textarea class="question-input js-question-input" type="text" placeholder="Enter your topic" rows="4"></textarea>
      <button class="question-input-button js-input-button" type="button">Add</button>
    </div>
    <div class="answers-container" >
      <textarea class="answers-input js-answers-input" type="text" placeholder="Enter your topic answer" rows="5"></textarea>
      <button class="answer-input-button js-input-button-answer" type="submit">Submit</button>
    </div>

    </div>
    <script src="script/main.js" type="module"></script>
  </body>
</html>
